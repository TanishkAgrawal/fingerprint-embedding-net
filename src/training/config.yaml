# Single source of defaults for train / eval / tune.
# tune_grid.yaml only lists keys that CHANGE in a trial (it overlays this file).
#
# Every EXISTING key below is unchanged, so the three finished baselines stay
# reproducible. Keys marked NEW default to "off" or to the old hard-coded
# behaviour, so they change nothing until a trial overrides them.
#
# FINISHED baselines - train.py refuses to write these unless you pass
# --resume-baseline (only needed to continue VGG from epoch 14):
#   checkpoints/resnet18_arcface     epoch 25  (evaluated)
#   checkpoints/densenet_arcface     epoch 25  (evaluated; name is densenet not densenet121)
#   checkpoints/vgg16_arcface        epoch 14  (evaluated; unfinished vs 25)
#
# Limited-time plan: do NOT retrain those three. ResNet-only tuning:
#   python -m src.training.tune --dry-run
#   python -m src.training.tune --backbone resnet18
# Writes to checkpoints/tune/resnet18_<trial>/  (will not touch baselines).

# DenseNet121 + ArcFace configuration

model:
  backbone: vgg16
  embedding_dim: 512

loss:
  type: arcface
  kwargs:
    margin: 28.6
    scale: 64.0

training:
  device: cuda
  cuda_device: 0
  epochs: 25
  frozen_epochs: 10
  batch_size: 8
  learning_rate: 0.001
  backbone_lr_scale: 0.1
  weight_decay: 0.0005
  lr_decay: true
  log_interval: 100
  grad_clip_norm: 5.0
  early_stop_patience: 0
  phase2_lr_scale: 1.0
  seed: 42
  compute_val_loss: false

augmentation:
  rotation_deg: 20
  translate_frac: 0.0
  scale_range: [1.0, 1.0]
  contrast_range: [0.9, 1.1]
  brightness_range: [-0.05, 0.05]
  partial_crop_prob: 0.3
  partial_crop_min_frac: 0.7
  partial_crop_max_frac: 0.95
  erase_prob: 0.0
  noise_std: 0.0

data:
  train_csv: data/processed/train/train.csv
  val_csv: data/processed/val/val.csv
  test_csv: data/processed/test/test.csv
  num_workers: 0

output:
  checkpoint_dir: checkpoints
  log_dir: outputs/logs
  results_dir: outputs/results